name = "applyflow-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://applyflowforcloudflare.pages.dev"
APP_CORS_ORIGINS = "https://applyflowforcloudflare.pages.dev,http://localhost:5173"


# Cloudflare Durable Objects for Persistent Multi-Room Chat
[durable_objects]
bindings = [
  { name = "CHAT_ROOMS", class_name = "ChatRoomDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoomDO"]

# Scheduled Background Tasks (Cron Triggers)
# e.g., Daily resume and notification maintenance at 03:00 UTC
[triggers]
crons = ["0 3 * * *"]
